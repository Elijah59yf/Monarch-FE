<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journal | Monarch</title>
    <meta name="description" content="Thoughts on technology, engineering, and the craft of building systems.">
    
    <!-- PWA -->
    <link rel="manifest" href="../manifest.json">
    <meta name="theme-color" content="#c67b5c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Monarch">
    <link rel="apple-touch-icon" href="../img/icon-192.png">
    
    
    
    <!-- Styles -->
    <link rel="stylesheet" href="../style.css">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container">
            <a href="../index.html" class="logo">Monarch</a>
            <nav>
                <div class="hamburger">
                    <div class="line"></div>
                    <div class="line"></div>
                    <div class="line"></div>
                </div>
                <ul class="nav-links">
                    <li><a href="../index.html" data-i18n="nav.home">Home</a></li>
                    <li><a href="about.html" data-i18n="nav.about">About</a></li>
                    <li><a href="services.html" data-i18n="nav.services">Services</a></li>
                    <li><a href="projects.html" data-i18n="nav.projects">Projects</a></li>
                    <li><a href="blog.html" class="active" data-i18n="nav.journal">Journal</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <!-- Page Header -->
        <section class="page-header fade-in">
            <div class="container">
                <h1 data-i18n="blog.title">Journal</h1>
                <p data-i18n="blog.subtitle">Reflections on technology, learning, and craft.</p>
            </div>
        </section>

        <!-- Blog List -->
        <section class="blog-section fade-in">
            <div class="container container-narrow" id="blog-container">
                <!-- Expandable Search -->
                <div class="search-wrapper">
                    <button class="search-toggle" id="search-toggle" aria-label="Search articles">
                        <svg class="icon icon-search" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-search"/></svg>
                    </button>
                    <div class="search-box">
                        <input type="text" id="blog-search" data-i18n-placeholder="blog.search" placeholder="Search articles..." autocomplete="off">
                        <button class="search-clear" id="search-clear" aria-label="Clear search">
                            <svg class="icon icon-close" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-close"/></svg>
                        </button>
                    </div>
                </div>
                <p class="search-results-count" id="search-results-count"></p>
                
                <!-- Posts will be injected here by JS -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <span class="footer-logo">Monarch</span>
                <div class="social-icons">
                    <a href="https://www.linkedin.com/in/elijah59yf" target="_blank" aria-label="LinkedIn" rel="noopener noreferrer">
                        <svg class="icon icon-linkedin" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-linkedin"/></svg>
                    </a>
                    <a href="https://github.com/Elijah59yf" target="_blank" aria-label="GitHub" rel="noopener noreferrer">
                        <svg class="icon icon-github" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-github"/></svg>
                    </a>
                    <a href="mailto:eakinseloyin@gmail.com" aria-label="Email">
                        <svg class="icon icon-mail" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-mail"/></svg>
                    </a>
                </div>
                <p>&copy; 2026 Akinseloyin Elijah Oluwademilade</p>
            </div>
        </div>
    </footer>

    <!-- Theme Toggle -->
    <button class="theme-toggle" aria-label="Toggle dark mode" title="Toggle theme">
        <svg class="icon icon-moon" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-moon"/></svg>
        <svg class="icon icon-sun" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-sun"/></svg>
    </button>
    
    <!-- Language Toggle -->
    <button class="lang-toggle" id="lang-toggle" aria-label="Change language" title="Change language">
        <svg class="icon icon-globe" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-globe"/></svg>
        <span class="lang-code" id="current-lang">EN</span>
    </button>
    <div class="lang-dropdown" id="lang-dropdown">
        <button class="lang-option active" data-lang="en">
            <span>English</span>
        </button>
        <button class="lang-option" data-lang="ja">
            <span>日本語</span>
        </button>
        <button class="lang-option" data-lang="de">
            <span>Deutsch</span>
        </button>
    </div>

    <!-- Back to Top -->
    <a id="back-to-top" href="#"><svg class="icon icon-arrow-up" aria-hidden="true"><use href="/assets/icons/monarch-icons.svg#i-arrow-up"/></svg></a>

    <script src="../translations.js"></script>
    <script src="../script.js" defer></script>
</body>
</html>
